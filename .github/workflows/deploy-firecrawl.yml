name: Deploy Firecrawl Stack

on:
  push:
    branches:
      - phase0/crabbox-selfhost-baseline
    paths:
      - 'apps/api/**'
      - 'firecrawl-agent/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy-firecrawl.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Write SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Pull latest code and rebuild on prod
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@"$DEPLOY_HOST" << 'ENDSSH'
            set -e
            cd /home/openclaw/firecrawl
            git config --global --add safe.directory /home/openclaw/firecrawl
            git fetch origin
            git checkout phase0/crabbox-selfhost-baseline
            git pull origin phase0/crabbox-selfhost-baseline
            docker compose up --build -d firecrawl-agent api
            docker image prune -f
            echo "Deploy complete: $(git log --oneline -1)"
ENDSSH

          rm -f ~/.ssh/deploy_key

      - name: Verify API is up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 10
          curl -sf --max-time 15 \
            "https://firecrawl.theochinomona.tech/v1/scrape" \
            -X POST -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com","formats":["markdown"]}' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("API OK, title:", d.get("data",{}).get("metadata",{}).get("title","?"))'
